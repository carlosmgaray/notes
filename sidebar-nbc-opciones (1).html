<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBC — Sidebar agrupado por produto (teste de escala)</title>
<style>
  :root{
    --hdr-a:#242a78; --hdr-b:#323a9a;
    --side-top:#18227a; --side-mid:#27479c; --side-bot:#4a78c4;
    --active:#1b2db8;
    --label:#6a85f7;
    --badge:#1aa7ff;
    --ink:#161b5a;
    --paper:#f7f6f1;
    --font: "ContiSans", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);background:#e9ebf3;color:var(--ink)}
  button{font-family:inherit;cursor:pointer}
  button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}

  /* ---------- controles fuera de la app ---------- */
  .switcher{max-width:1180px;margin:20px auto 12px;padding:0 16px}
  .switcher h1{font-size:18px;margin:0 0 10px;color:#2a2f55}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
  .row .k{font-size:13px;font-weight:700;color:#4b5285;margin-right:4px}
  .row button{border:1px solid #b9c0e6;background:#fff;color:#1b2db8;font-weight:600;font-size:14px;padding:9px 14px;border-radius:10px}
  .row button[aria-pressed="true"]{background:#1b2db8;color:#fff;border-color:#1b2db8}
  .cap{margin:8px 0 0;font-size:14px;color:#39406e;line-height:1.5;max-width:960px}
  .cap b{color:#1b2db8}

  /* ---------- app ---------- */
  .app{max-width:1180px;height:680px;margin:0 auto 32px;border-radius:14px;overflow:hidden;display:grid;grid-template-rows:68px 1fr;box-shadow:0 10px 30px rgba(20,25,80,.25);background:var(--paper)}
  .hdr{display:flex;align-items:center;gap:20px;padding:0 20px;background:linear-gradient(90deg,var(--hdr-a),var(--hdr-b));color:#fff}
  .brand{font-size:36px;font-weight:700;letter-spacing:-1.5px;width:260px;flex:none}
  .search{flex:1;max-width:640px;height:40px;border-radius:12px;background:#f4f4f6;color:#6b7090;display:flex;align-items:center;padding:0 16px;font-size:15px}
  .body{display:flex;min-height:0}

  /* ---------- sidebar ---------- */
  .side{flex:none;width:300px;height:100%;background:linear-gradient(180deg,var(--side-top) 0%,var(--side-mid) 55%,var(--side-bot) 100%);color:#fff;overflow:hidden}
  .side.wide{width:350px;display:flex;background:none}
  .side-in{height:100%;padding:22px 16px 0;display:flex;flex-direction:column;gap:6px;min-height:0}
  .scroll{flex:1;min-height:0;overflow-y:auto;margin:0 -10px;padding:0 10px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.35) transparent}
  .foot{padding-bottom:12px}
  .lbl-sec{font-size:13px;font-weight:700;letter-spacing:.2px;color:var(--label);text-transform:uppercase;padding:14px 10px 8px}
  .lbl-sec.grp{padding:12px 10px 4px;color:#9fb3ff;font-size:12px}
  .nav-main{display:flex;align-items:center;gap:14px;width:100%;border:0;background:var(--active);color:#fff;font-size:17px;font-weight:700;text-align:left;border-radius:14px;padding:18px 18px;letter-spacing:-.3px}
  .nav-item,.grp-h,.card,.back,.act,.pick,.opt{display:flex;align-items:center;gap:14px;width:100%;border:0;background:transparent;color:#fff;font-size:17px;font-weight:600;text-align:left;border-radius:14px;padding:13px 14px;letter-spacing:-.3px;line-height:1.2}
  .nav-item:hover,.grp-h:hover,.act:hover,.back:hover,.opt:hover{background:rgba(255,255,255,.1)}
  .nav-item.on,.opt.on{background:rgba(255,255,255,.18)}
  .nav-item .lbl,.grp-h .lbl,.opt .lbl,.pick .lbl{flex:1}
  .badge{min-width:30px;height:30px;border-radius:15px;background:var(--badge);color:#fff;font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 8px;flex:none}
  .rule{height:1px;background:rgba(255,255,255,.18);margin:0 6px}
  .chev{transition:transform .2s;flex:none;display:flex}
  .sub{margin:2px 0 6px 26px;padding-left:10px;border-left:2px solid rgba(255,255,255,.25);display:flex;flex-direction:column;gap:2px}
  .sub .nav-item{font-size:16px;padding:11px 12px}
  .empty{padding:14px 12px;font-size:14px;color:#d3ddff}
  .sbox{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.28);border-radius:12px;padding:0 12px;margin:2px 0 8px;color:#d3ddff}
  .sbox input{flex:1;min-width:0;height:40px;border:0;background:transparent;color:#fff;font:inherit;font-size:15px}
  .sbox input::placeholder{color:#b7c5ff}

  /* B */
  .card{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);padding:13px 14px;gap:14px;margin-bottom:6px}
  .card:hover{background:rgba(255,255,255,.2)}
  .ico-box{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:none}
  .card .t{flex:1;display:flex;flex-direction:column;gap:2px;font-size:17px;font-weight:700}
  .card .t small{font-size:12px;font-weight:500;color:#d3ddff}
  .back{width:max-content;font-size:14px;color:#d3ddff;padding:8px 10px;gap:8px}
  .ptitle{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:700;letter-spacing:-.5px;padding:4px 10px 0}

  /* C */
  .rail{width:92px;flex:none;height:100%;background:#0e1445;display:flex;flex-direction:column;align-items:center;padding:18px 8px 10px}
  .rscroll{flex:1;min-height:0;width:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:6px;scrollbar-width:none}
  .rbtn{position:relative;width:74px;flex:none;border:0;background:transparent;color:#fff;border-radius:14px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:600;line-height:1.15;text-align:center}
  .rbtn:hover{background:rgba(255,255,255,.1)}
  .rbtn.on{background:rgba(255,255,255,.18)}
  .rbtn .badge{position:absolute;top:2px;right:6px;min-width:20px;height:20px;font-size:11px;padding:0 5px;border-radius:10px}
  .rbtn .ic{display:flex}
  .rbtn span.n{display:block;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .panel{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--side-top) 0%,var(--side-mid) 55%,var(--side-bot) 100%);padding:24px 14px 0}
  .panel h2{margin:0 10px 4px;font-size:21px;letter-spacing:-.5px}

  /* D */
  .pickwrap{position:relative}
  .pick{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);padding:12px 14px}
  .pick:hover{background:rgba(255,255,255,.18)}
  .dd{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#0f1763;border:1px solid rgba(255,255,255,.28);border-radius:14px;padding:8px;z-index:5;box-shadow:0 14px 30px rgba(0,0,10,.45)}
  .ddlist{max-height:330px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.35) transparent}
  .opt{font-size:16px;padding:11px 12px}
  .opt .badge{min-width:26px;height:26px;font-size:12px}

  /* ---------- contenido (referencia, estático) ---------- */
  .main{flex:1;min-width:0;padding:22px 26px;overflow:auto;background:var(--paper)}
  .main h3{margin:0 0 14px;font-size:28px;letter-spacing:-.8px;color:var(--ink)}
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
  .chip{border:1px solid #b8c3ee;color:#26307a;background:transparent;border-radius:999px;padding:7px 16px;font-size:14px}
  .chip.on{background:#1c2f9c;color:#fff;border-color:#1c2f9c;font-weight:700}
  .opcard{background:#fff;border:1px solid #e6e4da;border-left:4px solid #f0a8b8;border-radius:16px;padding:18px 20px;max-width:640px;margin-top:14px}
  .opcard b{font-size:20px;letter-spacing:-.4px}
  .opcard p{margin:6px 0;color:#5a5f86;font-size:15px}
  .opcard code{font-size:15px;color:#2a2f55}
  .pill{float:right;background:#1c2f9c;color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:5px 12px}
</style>
</head>
<body>

<div class="switcher">
  <h1>Sidebar NBC agrupado por produto — 4 opções (clique dentro do menu para testar)</h1>
  <div class="row" id="tabs" role="group" aria-label="Opções"></div>
  <div class="row" id="datatabs" role="group" aria-label="Volume de dados"></div>
  <p class="cap" id="cap"></p>
</div>

<div class="app">
  <div class="hdr">
    <div class="brand">nbcbank</div>
    <div class="search">Buscar em todos os campos...</div>
  </div>
  <div class="body">
    <aside class="side" id="side" aria-label="Menu lateral"></aside>
    <section class="main">
      <h3>Acompanhamento...</h3>
      <div class="chips"><span class="chip on">Todos</span><span class="chip">ATIVO · 5</span><span class="chip">EXCLUÍDO · 0</span><span class="chip">FINALIZADO · 0</span></div>
      <div class="opcard">
        <span class="pill">ATIVO</span>
        <b>Encaminhamento para Área Responsável</b>
        <p>Gestão Compliance · Normativas Externas</p>
        <code># OP-01-01-261112-00002</code>
      </div>
    </section>
  </div>
</div>

<script>
const P = {
  inbox:'<path d="M3 13l3-8h12l3 8"/><path d="M3 13v6h18v-6h-5l-1.5 2h-5L8 13H3z"/>',
  shield:'<path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6l8-3z"/><path d="M8.5 12l2.5 2.5L15.5 10"/>',
  audit:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.2-4.2"/><path d="M8.5 11l1.8 1.8L13.5 9.5"/>',
  box:'<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
  doc:'<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M9.5 12h5M9.5 16h5"/>',
  chevD:'<path d="M6 9l6 6 6-6"/>',
  chevR:'<path d="M9 6l6 6-6 6"/>',
  back:'<path d="M15 6l-6 6 6 6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/>'
};
const svg = (k, s = 24, sw = 1.8) =>
  `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[k]}</svg>`;

/* Dados: só Compliance e Auditoria são reais (da captura). Os outros são de exemplo, para testar escala. */
const REAL = [
  { id:'comp', label:'Compliance', icon:'shield', items:[
    { id:'ext', label:'Gestão de Normativos Externos', count:2 },
    { id:'int', label:'Gestão de Normativos Internos', count:2 } ] },
  { id:'aud', label:'Auditoria', icon:'audit', items:[
    { id:'apo', label:'Apontamentos de Auditoria', count:1 } ] }
];
const mk = (n, cnt) => ({
  id:'p' + n, label:'Produto ' + String(n).padStart(2, '0') + ' (exemplo)', icon:'box',
  items:Array.from({ length:cnt }, (_, k) => ({ id:'p' + n + 's' + (k + 1), label:'Subproduto ' + (k + 1) + ' do produto ' + n, count:(k * 3 + n) % 4 + 1 }))
});
const EXTRA = [[3,1],[4,3],[5,5],[6,2],[7,8],[8,4],[9,12]].map(([n, c]) => mk(n, c));

const S = { opt:'A', data:'scale', open:{ comp:true }, sel:'ext', view:'root', tab:'comp', dd:false, q:'', pq:'' };
const prods = () => S.data === 'real' ? REAL : REAL.concat(EXTRA);
const find = (id) => prods().find((p) => p.id === id);
const total = (p) => p.items.reduce((a, i) => a + i.count, 0);
const flt = (items, q) => q ? items.filter((i) => i.label.toLowerCase().includes(q.toLowerCase())) : items;
const esc = (s) => s.replace(/"/g, '&quot;');

const OPTIONS = {
  A: { name:'A · Acordeão', cap:'<b>Com 9 produtos:</b> os 9 cabeçalhos cabem fechados e só um fica aberto por vez; a lista rola dentro do menu. <b>Limite:</b> a coluna de produtos cresce na vertical e, com 20+ produtos, vira uma lista longa para varrer.' },
  B: { name:'B · Dois níveis', cap:'<b>Com 9 produtos:</b> o menu raiz mostra só produtos; cada produto tem sua própria lista, com filtro quando passa de 6 itens. <b>É a que melhor escala em subprodutos:</b> nunca mostra mais de um produto por vez. Custo: um clique para entrar e outro para voltar.' },
  C: { name:'C · Trilho + painel', cap:'<b>Com 9 produtos:</b> o trilho rola sozinho (passa de ~7) e o painel tem filtro. Padrão conhecido (estilo Azure/Jira), bom para troca rápida entre produtos. <b>Custo:</b> usa ~50 px a mais de largura e a coluna estreita só mostra o nome abreviado do produto.' },
  D: { name:'D · Seletor com busca', cap:'<b>Com 9 produtos:</b> um seletor de produto com busca (como troca de workspace) e, embaixo, só os subprodutos do escolhido. <b>Escala para dezenas de produtos</b> sem crescer em altura. Custo: os produtos ficam escondidos dentro do dropdown e a troca leva um clique a mais.' }
};

const badge = (n) => `<span class="badge">${n}</span>`;
const item = (i) => `<button class="nav-item ${S.sel === i.id ? 'on' : ''}" data-act="sel" data-val="${i.id}">${svg('doc')}<span class="lbl">${i.label}</span>${badge(i.count)}</button>`;
const items = (list, q) => { const f = flt(list, q); return f.length ? f.map(item).join('') : '<div class="empty">Nenhum subproduto encontrado</div>'; };
const inbox = () => `<button class="nav-main">${svg('inbox')}<span>Minha Caixa de Entrada</span></button>`;
const acoes = () => `<div class="rule"></div><div class="lbl-sec" style="padding-bottom:4px">Ações</div><button class="act">${svg('plus')}<span>Novo apontamento</span></button>`;
const sbox = (id, val, ph) => `<div class="sbox">${svg('search', 16, 2)}<input id="${id}" value="${esc(val)}" placeholder="${ph}" aria-label="${ph}" autocomplete="off"></div>`;
const shell = (top, scroll) => `<div class="side-in"><div>${top}</div><div class="scroll">${scroll}</div><div class="foot">${acoes()}</div></div>`;

function renderA() {
  const groups = prods().map((p) => {
    const open = !!S.open[p.id];
    return `<div>
      <button class="grp-h" data-act="toggle" data-val="${p.id}" aria-expanded="${open}">
        ${svg(p.icon)}<span class="lbl">${p.label}</span>${badge(total(p))}
        <span class="chev" style="transform:rotate(${open ? 180 : 0}deg)">${svg('chevD', 18, 2)}</span>
      </button>
      ${open ? `<div class="sub">${p.items.map(item).join('')}</div>` : ''}
    </div>`;
  }).join('');
  return shell(inbox(), `<div class="lbl-sec">Filtros rápidos</div>${groups}`);
}

function renderB() {
  if (S.view === 'root') {
    const cards = prods().map((p) => `<button class="card" data-act="go" data-val="${p.id}">
      <span class="ico-box">${svg(p.icon, 22)}</span>
      <span class="t">${p.label}<small>${p.items.length === 1 ? '1 subproduto' : p.items.length + ' subprodutos'}</small></span>
      ${badge(total(p))}${svg('chevR', 18, 2)}</button>`).join('');
    return shell(inbox(), `<div class="lbl-sec">Filtros rápidos</div>${cards}`);
  }
  const p = find(S.view);
  const top = `${inbox()}<div style="height:6px"></div>
    <button class="back" data-act="go" data-val="root">${svg('back', 16, 2)}Voltar</button>
    <div class="ptitle">${svg(p.icon, 24)}${p.label}</div>`;
  return shell(top, `<div class="lbl-sec">Subprodutos</div>${p.items.length > 6 ? sbox('q', S.q, 'Filtrar subprodutos...') : ''}${items(p.items, S.q)}`);
}

function renderC() {
  const rail = [{ id:'inbox', short:'Caixa de Entrada', icon:'inbox', count:0 },
    ...prods().map((p) => ({ id:p.id, short:p.label.replace(' (exemplo)', ''), icon:p.icon, count:total(p) }))]
    .map((r) => `<button class="rbtn ${S.tab === r.id ? 'on' : ''}" data-act="tabC" data-val="${r.id}" aria-pressed="${S.tab === r.id}" title="${esc(r.short)}">
      <span class="ic">${svg(r.icon, 26)}</span>${r.count ? badge(r.count) : ''}<span class="n">${r.short}</span></button>`).join('');
  let title, kicker, body, many;
  if (S.tab === 'inbox') {
    title = 'Minha Caixa de Entrada'; kicker = 'Filtros rápidos';
    const all = prods().flatMap((p) => p.items);
    many = all.length > 6;
    body = prods().map((p) => { const f = flt(p.items, S.q); return f.length ? `<div class="lbl-sec grp">${p.label}</div>${f.map(item).join('')}` : ''; }).join('')
      || '<div class="empty">Nenhum subproduto encontrado</div>';
  } else {
    const p = find(S.tab); title = p.label; kicker = 'Subprodutos'; many = p.items.length > 6; body = items(p.items, S.q);
  }
  return `<div class="rail"><div style="font-weight:700;font-size:18px;letter-spacing:-.5px;padding-bottom:10px">nbc</div>
      <div class="rscroll">${rail}</div>
      <button class="rbtn" aria-label="Novo apontamento" style="margin-top:6px"><span class="ic">${svg('plus', 26)}</span><span class="n">Novo</span></button></div>
    <div class="panel"><h2>${title}</h2><div class="lbl-sec" style="padding-top:6px">${kicker}</div>
      ${many ? sbox('q', S.q, 'Filtrar subprodutos...') : ''}<div class="scroll">${body}</div></div>`;
}

function renderD() {
  const p = find(S.tab === 'inbox' ? 'comp' : S.tab) || prods()[0];
  const plist = flt(prods(), S.pq).map((x) => `<button class="opt ${x.id === p.id ? 'on' : ''}" data-act="pickp" data-val="${x.id}">${svg(x.icon, 20)}<span class="lbl">${x.label}</span>${badge(total(x))}</button>`).join('')
    || '<div class="empty">Nenhum produto encontrado</div>';
  const top = `${inbox()}<div class="lbl-sec">Produto</div>
    <div class="pickwrap">
      <button class="pick" data-act="dd" aria-expanded="${S.dd}" aria-haspopup="listbox">${svg(p.icon)}<span class="lbl">${p.label}</span>${badge(total(p))}<span class="chev" style="transform:rotate(${S.dd ? 180 : 0}deg)">${svg('chevD', 18, 2)}</span></button>
      ${S.dd ? `<div class="dd">${sbox('pq', S.pq, 'Buscar produto...')}<div class="ddlist">${plist}</div></div>` : ''}
    </div>`;
  return shell(top, `<div class="lbl-sec">Subprodutos</div>${p.items.length > 6 ? sbox('q', S.q, 'Filtrar subprodutos...') : ''}${items(p.items, S.q)}`);
}

function render(keep) {
  const tops = [...document.querySelectorAll('.scroll,.rscroll,.ddlist')].map((n) => n.scrollTop);
  if (S.view !== 'root' && !find(S.view)) S.view = 'root';
  if (S.tab !== 'inbox' && !find(S.tab)) S.tab = 'comp';
  const side = document.getElementById('side');
  side.className = 'side' + (S.opt === 'C' ? ' wide' : '');
  side.innerHTML = { A:renderA, B:renderB, C:renderC, D:renderD }[S.opt]();
  if (keep) {
    const nodes = [...document.querySelectorAll('.scroll,.rscroll,.ddlist')];
    if (nodes.length === tops.length) nodes.forEach((n, i) => { n.scrollTop = tops[i]; });
  }
  document.getElementById('cap').innerHTML = OPTIONS[S.opt].cap;
  document.getElementById('tabs').innerHTML = '<span class="k">Opção:</span>' + Object.keys(OPTIONS).map((k) =>
    `<button data-act="opt" data-val="${k}" aria-pressed="${S.opt === k}">${OPTIONS[k].name}</button>`).join('');
  document.getElementById('datatabs').innerHTML = '<span class="k">Dados:</span>' + [['real', 'Reais (2 produtos)'], ['scale', 'Teste de escala (9 produtos, até 12 subprodutos)']].map(([k, t]) =>
    `<button data-act="data" data-val="${k}" aria-pressed="${S.data === k}">${t}</button>`).join('');
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (S.dd && !e.target.closest('.pickwrap')) { S.dd = false; render(true); } return; }
  const v = el.dataset.val;
  let keep = true;
  switch (el.dataset.act) {
    case 'opt': S.opt = v; S.q = ''; S.pq = ''; S.dd = false; keep = false; break;
    case 'data': S.data = v; S.q = ''; S.pq = ''; S.dd = false; S.open = { comp:true }; S.view = 'root'; S.tab = 'comp'; keep = false; break;
    case 'toggle': S.open = S.open[v] ? {} : { [v]:true }; break;
    case 'sel': S.sel = v; break;
    case 'go': S.view = v; S.q = ''; keep = false; break;
    case 'tabC': S.tab = v; S.q = ''; keep = false; break;
    case 'dd': S.dd = !S.dd; S.pq = ''; break;
    case 'pickp': S.tab = v; S.dd = false; S.pq = ''; S.q = ''; keep = false; break;
  }
  render(keep);
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id !== 'q' && t.id !== 'pq') return;
  S[t.id] = t.value;
  const pos = t.selectionStart;
  render(true);
  const n = document.getElementById(t.id);
  if (n) { n.focus(); n.setSelectionRange(pos, pos); }
});
render(false);
</script>
</body>
</html>
